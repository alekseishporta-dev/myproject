name: Terragrunt Local GitOps

on:
  push:
    branches:
      - main

jobs:
  dev-env:
    name: Deploy Dev
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terragrunt Apply Dev
        run: |
          cd live/dev
          terragrunt --terragrunt-non-interactive apply -auto-approve

  prod-env:
    name: Deploy Prod
    runs-on: self-hosted
    needs: dev-env
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terragrunt Apply Prod
        run: |
          cd live/prod
          terragrunt --terragrunt-non-interactive apply -auto-approve
